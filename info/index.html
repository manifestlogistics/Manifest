alf.", "We process data only to provide the service, keep it protected, and delete it when you delete it.", "Business customers who need a signed DPA can request one at support@manifestlogistics.app."]}, "cookies": {"t": "Cookie Policy", "p": ["Manifest uses only what the app needs to work: a sign-in session and your display preferences stored in your browser.", "We do not use advertising cookies."]}, "security": {"t": "Security & Trust", "p": ["Accounts are protected by a password and each customer can only see their own data (row-level security in the database).", "Connections are encrypted (HTTPS). Passwords are never stored in readable form.", "The database is backed up weekly to a private location.", "Found a problem? Please tell us at support@manifestlogistics.app."]}, "help": {"t": "Help Center & Guides", "p": ["<b>Add a shipment:</b> open the app, tap New shipment, enter the number and your transporter's email.", "<b>How check-ins work:</b> Manifest emails your transporter. They tap a button (Moving, Customs, Delayed, Delivered) or just reply, and your dashboard updates.", "<b>No reply?</b> Manifest flags silent transporters under \"Need your attention\".", "Still stuck? Email support@manifestlogistics.app. We aim to reply within 48 hours."]}, "whatsapp": {"t": "WhatsApp & Email Setup", "p": ["<b>Email</b> works today: add your transporter's email and Manifest sends the check-in for you.", "<b>WhatsApp</b> is coming. Transporters will get check-ins from Manifest's own business number, so you do not need to connect your personal WhatsApp.", "Contacts must agree to be messaged before WhatsApp check-ins start."]}, "changelog": {"t": "What's New", "p": ["<b>Nov 2026:</b> New landing page, account setup flow, and username login.", "<b>Earlier:</b> Email check-ins with one-tap status buttons, public tracking links, delay alerts, 22 languages."]}};var k=new URLSearchParams(location.search).get("p"),d=D[k]||D.help;document.title=d.t+" | Manifest";document.getElementById("c").innerHTML="<h1>"+d.t+"</h1>"+(/privacy|terms|dpa|cookies|security/.test(k)?"<div class=note>Plain-language summary. A full legal version will replace this before paid plans open.</div>":"")+d.p.map(function(x){return"<p style=margin:14px 0>"+x+"</p>"}).join("");</script></body></html>
